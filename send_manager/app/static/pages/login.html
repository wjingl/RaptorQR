<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — RaptorQR 发送管理</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>◈ RaptorQR 发送管理</h1>
      <p class="sub">内网文件传出记录系统 · 请登录</p>
      <div id="alert" class="alert"></div>
      <form id="loginForm" autocomplete="on">
        <div class="form-row">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" autocomplete="username" maxlength="64" required />
        </div>
        <div class="form-row">
          <label for="password">密码</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" maxlength="128" required />
            <button type="button" id="togglePw" class="pw-toggle" title="显示/隐藏密码" aria-label="显示密码" tabindex="-1">👁</button>
          </div>
        </div>
        <div class="form-row" id="captchaRow" style="display:none;">
          <label for="captchaAnswer">验证码（点击图片刷新）</label>
          <div class="captcha-row">
            <input type="text" id="captchaAnswer" maxlength="8" autocomplete="off" placeholder="输入验证码" />
            <span id="captchaImg"></span>
          </div>
        </div>
        <button class="btn" type="submit" id="submitBtn" style="width:100%;">登 录</button>
      </form>
      <div class="link-line">
        没有账号？<a href="/register">自助注册</a>
      </div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
