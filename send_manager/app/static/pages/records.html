<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>传出记录 — RaptorQR 发送管理</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container">
    <h1 class="page-title">传出记录</h1>
    <p class="page-sub" id="pageSub">文件传出历史与状态</p>
    <div id="alert" class="alert"></div>

    <div class="card">
      <h2>筛选</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;">
        <div id="userFilter" style="display:none;flex:1;min-width:140px;">
          <label style="display:block;font-size:12px;color:#8b949e;margin-bottom:4px;">用户</label>
          <select id="fUser" style="width:100%;"><option value="">全部用户</option></select>
        </div>
        <div style="flex:1;min-width:140px;">
          <label style="display:block;font-size:12px;color:#8b949e;margin-bottom:4px;">目的地</label>
          <select id="fDest" style="width:100%;"><option value="">全部</option></select>
        </div>
        <div style="flex:1;min-width:140px;">
          <label style="display:block;font-size:12px;color:#8b949e;margin-bottom:4px;">状态</label>
          <select id="fStatus" style="width:100%;">
            <option value="">全部</option>
            <option value="sending">传输中</option>
            <option value="completed">已完成</option>
            <option value="stopped">已停止</option>
            <option value="failed">失败</option>
          </select>
        </div>
        <div style="flex:1;min-width:140px;">
          <label style="display:block;font-size:12px;color:#8b949e;margin-bottom:4px;">开始日期</label>
          <input type="date" id="fFrom" />
        </div>
        <div style="flex:1;min-width:140px;">
          <label style="display:block;font-size:12px;color:#8b949e;margin-bottom:4px;">结束日期</label>
          <input type="date" id="fTo" />
        </div>
        <div style="flex:2;min-width:180px;">
          <label style="display:block;font-size:12px;color:#8b949e;margin-bottom:4px;">关键词（文件名）</label>
          <input type="text" id="fQ" maxlength="64" placeholder="搜索文件名…" />
        </div>
        <button class="btn secondary" id="btnSearch">查询</button>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th id="thUser" style="display:none;">用户</th>
              <th>开始时间</th>
              <th>文件名</th>
              <th>大小</th>
              <th>目的地</th>
              <th>状态</th>
              <th>完成时间</th>
              <th>备份</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" style="text-align:center;color:#8b949e;padding:30px 0;display:none;">暂无记录</div>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/records.js"></script>
</body>
</html>
