<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自助注册 — RaptorQR 发送管理</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>自助注册</h1>
      <p class="sub">提交后需总管理审批通过方可登录</p>
      <div id="alert" class="alert"></div>
      <form id="registerForm" autocomplete="off">
        <div class="form-row">
          <label for="username">用户名（字母/数字/下划线，3-32 位）</label>
          <input type="text" id="username" maxlength="32" required />
        </div>
        <div class="form-row">
          <label for="displayName">姓名 / 显示名</label>
          <input type="text" id="displayName" maxlength="50" required />
        </div>
        <div class="form-row">
          <label for="password">密码（至少 8 位）</label>
          <div class="pw-wrap">
            <input type="password" id="password" maxlength="64" required />
            <button type="button" class="pw-toggle" title="显示/隐藏密码" tabindex="-1">👁</button>
          </div>
        </div>
        <div class="form-row">
          <label for="password2">确认密码</label>
          <div class="pw-wrap">
            <input type="password" id="password2" maxlength="64" required />
            <button type="button" class="pw-toggle" title="显示/隐藏密码" tabindex="-1">👁</button>
          </div>
        </div>
        <button class="btn" type="submit" style="width:100%;">提交注册申请</button>
      </form>
      <div class="link-line">已有账号？<a href="/login">去登录</a></div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
