<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>审计日志 — RaptorQR 发送管理</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container">
    <h1 class="page-title">审计日志（总管理）</h1>
    <p class="page-sub">谁 / 何时 / 做了什么 —— 管理操作与登录事件全程留痕</p>
    <div id="alert" class="alert"></div>
    <div class="card">
      <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <input type="text" id="fQ" maxlength="64" placeholder="搜索用户 / 动作 / 详情…" style="flex:2;min-width:180px;" />
        <button class="btn secondary" id="btnSearch">查询</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>用户</th><th>动作</th><th>详情</th><th>IP</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" style="text-align:center;color:#8b949e;padding:24px 0;display:none;">暂无日志</div>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/audit.js"></script>
</body>
</html>
