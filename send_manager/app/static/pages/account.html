<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账号 — RaptorQR 发送管理</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container" style="max-width:560px;">
    <h1 class="page-title">账号与密码</h1>
    <p class="page-sub" id="pageSub">修改登录密码</p>
    <div id="alert" class="alert"></div>
    <div class="card">
      <div id="forcedWarn" class="alert warn" style="display:none;">
        首次登录或密码被重置：请立即修改密码后继续使用。
      </div>
      <form id="pwForm" autocomplete="off">
        <div class="form-row" id="oldRow">
          <label for="oldPassword">当前密码</label>
          <div class="pw-wrap">
            <input type="password" id="oldPassword" maxlength="128" autocomplete="current-password" />
            <button type="button" class="pw-toggle" title="显示/隐藏密码" tabindex="-1">👁</button>
          </div>
        </div>
        <div class="form-row">
          <label for="newPassword">新密码（8-64 位）</label>
          <div class="pw-wrap">
            <input type="password" id="newPassword" maxlength="64" autocomplete="new-password" />
            <button type="button" class="pw-toggle" title="显示/隐藏密码" tabindex="-1">👁</button>
          </div>
        </div>
        <div class="form-row">
          <label for="newPassword2">确认新密码</label>
          <div class="pw-wrap">
            <input type="password" id="newPassword2" maxlength="64" autocomplete="new-password" />
            <button type="button" class="pw-toggle" title="显示/隐藏密码" tabindex="-1">👁</button>
          </div>
        </div>
        <button class="btn" type="submit" id="submitBtn">修改密码</button>
      </form>
    </div>
    <div class="card">
      <h2>账号信息</h2>
      <p style="margin:4px 0;color:#8b949e;">用户名：<span id="infoUsername"></span></p>
      <p style="margin:4px 0;color:#8b949e;">角色：<span id="infoRole"></span></p>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
