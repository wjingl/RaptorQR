<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账号管理 — RaptorQR 发送管理</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container">
    <h1 class="page-title">账号管理（总管理）</h1>
    <p class="page-sub">注册审批 / 批量注册 / 重置密码 / 启停与归档</p>
    <div id="alert" class="alert"></div>

    <div class="card">
      <h2>待审批</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>用户名</th><th>姓名</th><th>注册时间</th><th>操作</th></tr></thead>
          <tbody id="pendingBody"></tbody>
        </table>
        <div id="pendingEmpty" style="text-align:center;color:#8b949e;padding:16px 0;">暂无待审批申请</div>
      </div>
    </div>

    <div class="card">
      <h2>批量注册</h2>
      <p style="font-size:12px;color:#8b949e;margin-top:0;">每行一个账号，格式：<code>用户名,姓名</code>（也支持 Tab / 中文逗号）。初始密码统一为系统配置的初始密码，用户首次登录须强制修改。</p>
      <textarea id="batchText" maxlength="200000" placeholder="zhangsan,张三&#10;lisi,李四&#10;wangwu,王五" style="font-family:ui-monospace,Consolas,monospace;"></textarea>
      <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button class="btn" id="btnBatch">执行批量注册</button>
        <span id="batchResult" style="font-size:13px;color:#8b949e;"></span>
      </div>
    </div>

    <div class="card">
      <h2>全部账号</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
        <input type="text" id="fQ" maxlength="64" placeholder="搜索用户名/姓名…" style="flex:2;min-width:180px;" />
        <select id="fStatus" style="flex:1;min-width:130px;">
          <option value="">全部状态</option>
          <option value="pending">待审批</option>
          <option value="active">正常</option>
          <option value="rejected">已驳回</option>
          <option value="disabled">已停用</option>
          <option value="archived">已归档</option>
        </select>
        <button class="btn secondary" id="btnSearch">搜索</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>用户名</th><th>姓名</th><th>角色</th><th>状态</th><th>注册时间</th><th>最近登录</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="userBody"></tbody>
        </table>
        <div id="userEmpty" style="text-align:center;color:#8b949e;padding:24px 0;display:none;">无匹配账号</div>
      </div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
