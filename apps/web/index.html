<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./raptorqr.svg" type="image/svg+xml" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0d1117; }
      #root { min-height: 100vh; }
      .boot-shell {
        min-height: 100vh;
        background: #0d1117;
        color: #f0f6fc;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-panel { width: min(440px, 100%); }
      .boot-title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .boot-body {
        color: #8b949e;
        font-size: 15px;
        line-height: 1.5;
        margin-bottom: 22px;
      }
      .boot-progress {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: #21262d;
        border: 1px solid #30363d;
      }
      .boot-progress-fill {
        width: 18%;
        height: 100%;
        background: #58a6ff;
      }
      .boot-meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 10px;
        color: #8b949e;
        font-size: 13px;
      }
      .file-warning {
        min-height: 100vh;
        background: #0d1117;
        color: #f0f6fc;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .file-warning-panel {
        width: min(560px, 100%);
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 24px;
        background: #161b22;
      }
      .file-warning-panel h1 { margin: 0 0 10px; font-size: 24px; }
      .file-warning-panel p { margin: 8px 0; color: #8b949e; line-height: 1.6; }
      .file-warning-panel code {
        display: block;
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        background: #0d1117;
        color: #c9d1d9;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
    <title>RaptorQR</title>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell">
        <section class="boot-panel" aria-label="RaptorQR startup">
          <h1 class="boot-title">RaptorQR</h1>
          <p class="boot-body">
            Preparing runtime assets for offline use. The app will open after the required WASM files are ready.
          </p>
          <div
            class="boot-progress"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="boot-progress-fill"></div>
          </div>
          <div class="boot-meta">
            <span>app shell</span>
            <span>starting</span>
          </div>
        </section>
      </main>
    </div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML = `
          <main class="file-warning">
            <section class="file-warning-panel" role="alert">
              <h1>Transfer Hub 需要通过本地网页服务打开</h1>
              <p>直接双击 index.html 会被浏览器的 file:// 安全策略阻止模块、Worker 和 WASM 加载。</p>
              <p>请双击同目录的 open-transfer-hub.bat，或在此目录运行下面的命令：</p>
              <code>python -m http.server 8080</code>
              <p>然后打开 http://127.0.0.1:8080/</p>
            </section>
          </main>`;
      }
    </script>
    <script id="app-module" type="module" src="/src/main.tsx"></script>
  </body>
</html>
